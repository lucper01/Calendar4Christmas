name: Calendar4Christmas secure checks

on:
  push:
    branches:
      - feature/cloudflare-private-albums
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: npm run check
      - name: Exercise protected Worker and bilingual content
        run: node tests/smoke.mjs
