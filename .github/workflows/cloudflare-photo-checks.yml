name: Cloudflare photo albums checks
on:
  push:
    branches: [feature/cloudflare-photo-albums]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: npm run check
      - name: API, album and localization smoke tests
        run: npm test
